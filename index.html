<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Drink Lover</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body>
        <!-- search button and seach box added -->
        <div class="search-box-button">
            <div class="search-box">
                <input id="input-field" type="text" class="style input-field"
                    placeholder="Search your drink">
            </div>
            <div class="search-button">
                <button id="search-button"
                    class="style search-button">Search</button>
            </div>
        </div>

        <!-- items and cart -->
        <section class="items-and-cart">
            <!-- show all drinks -->
            <div id="show-all-items" class="show-all-items">
                <!-- sob item ekhane dekhano hbe -->
                <!-- search er age and pore -->
            </div>

            <!-- cart section -->
            <div class="cart-section">
                <!-- show item after pressing add to cart -->
                <h2>Item in Cart: <span id="cart-count">0</span></h2>

                <div id="cart-items" class="cart-items">
                    <div
                        style="font-weight: bold; display: flex;justify-content: space-between;">
                        <p>SL</p>
                        <p>Image</p>
                        <p>Name</p>
                    </div>
                    <hr>
                </div>

            </div>
        </section>

        <section id="showdetailsonbtnclick">
            <div class="modal fade" id="drinkModal" tabindex="-1">

                <div class="modal-dialog modal-dialog-centered">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5 id="modal-title" class="modal-title">
                                Drink Details
                            </h5>

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal">
                            </button>

                        </div>

                        <div id="modal-body" class="modal-body">

                            

                        </div>

                        <div class="modal-footer">

                            <button
                                type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">

                                Close

                            </button>

                        </div>

                    </div>

                </div>

            </div>
        </section>

        <!-- add javascript file here -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
